[workspace]
resolver = "3"
members = [
    "tedi",
    "tedi_adapters",
    "tedi_core",
    "tedi_eval",
    "tedi_md",
    "tedi_task_operations",
    "tedi_task_primitives",
    "tedi_utils",
    "tedi_web",
]

[workspace.package]
version = "0.17.8"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/tedi"

[workspace.dependencies]
tedi_adapters = { path = "tedi_adapters", version = "0.17.8" }
tedi_core = { path = "tedi_core", version = "0.17.8" }
tedi_eval = { path = "tedi_eval", version = "0.17.8" }
tedi_md = { path = "tedi_md", version = "0.17.8" }
tedi_task_operations = { path = "tedi_task_operations", version = "0.17.8" }
tedi_task_primitives = { path = "tedi_task_primitives", version = "0.17.8" }
tedi_utils = { path = "tedi_utils", version = "0.17.8", default-features = false }
tedi_web = { path = "tedi_web" }

arrayvec = "0.7"
ask_llm = { version = "^3.0.1" }
async-trait = "^0.1.89"
base64 = "0.22"
clap = { version = "^4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
color-eyre = "0.6.5"
colored = "3"
config = "^0.15.22"
copy_arrayvec = "0.1"
derive-new = "^0"
derive_more = { version = "2.1.1", features = ["from_str", "display", "from", "into_iterator", "deref"] }
futures = "0.3.32"
image = "0.25.10"
jiff = { version = "^0.2", features = ["serde"] }
libwayshot = "0.7.3"
miette = { version = "7", features = ["fancy"] }
nucleo-matcher = "0.3"
png = "0.18"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "22"
regex = "1.12.3"
reqwest = { version = "^0.13.3", features = ["blocking", "json"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = { version = "^1.0.149", features = ["std"] }
skim = { version = "~5.9", default-features = false } # pinned to minor: we replace `App::matcher`, reachable only through `app_mut`
smart-default = "^0.7"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "^3.27.0"
thiserror = "2.0.18"
tokio = { version = "^1.52.1", features = ["rt", "rt-multi-thread"] }
tracing = "^0.1.44"
tracing-error = "^0.2"
url = "^2.5"
urlencoding = "^2.1.3"
v_utils = { version = "^2.24.0", default-features = false } # members name their features: tedi_core must stay wasm-safe
xdg = "3.0.0"

# web (tedi_web)
dioxus = "0.7"
dioxus-fullstack = "0.7"
dioxus-server = "0.7" # `#[server]` names it in what it expands to
ev_lib = { version = "0.32", default-features = false }
ev_lib_classes = "0.19"
getrandom = "0.3"
gloo-timers = "0.3"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
tilers_dioxus = { version = "0.3.4", default-features = false }
tokio-stream = "0.1"
tower-http = "0.6"
wasm-bindgen = "=0.2.129" # the flake's wasm-bindgen-cli is this version; a skew is a hard error
web-sys = "0.3"

# dev
ctor = "0.11"
derive_builder = "0.20"
insta = "1.47"
libc = "0.2"
rstest = "0.26"
v_fixtures = { version = "^0.3.4" }
walkdir = "2"

#[patch.crates-io]
#v_utils = { path = "../v_utils/v_utils" }
#v_fixtures = { path = "../v_fixtures" }

[workspace.lints.clippy]
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
#get_first = "allow" # const fn, so actually more performant
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
doc_lazy_continuation = "allow"
result_large_err = "allow" # errors carry their diagnostics (`#[wrap_err]`, miette sources); they ride the cold path

tabs_in_doc_comments = "allow"
if_not_else = "warn"
integer_division = "warn"

[workspace.lints.rust]
stable_features = "allow"
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"
