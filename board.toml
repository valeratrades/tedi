# The team's board: what the team instance and `nix run .#dev` show. Versions of each object on the board are this
# file's commits; a viewer's proposal is a pull request editing it.
watch = ["EV-Main", "EV-Estate", "EV-Service-Arb"]
orgs.EV-Main = ["EV-Service-Arb", "EV-Quant", "EV-Estate"]

[board.workflows]
kanban = "preset:kanban"
pull_requests = "preset:pull_requests"

[[board.views]]
name = "kanban"
group_by = "state:kanban"
shown = ["repo", "assignees", "importance", "hours", "type", "blockers"]
tints = { triage = "orange", selected = "blue", in_progress = "blue", in_review = "purple", done = "green" }

[[board.views]]
name = "pull_requests"
group_by = "state:pull_requests"
shown = ["repo", "assignees", "prs", "labels"]

[[board.views]]
name = "repo"
group_by = "repo"
shown = ["assignees", "importance", "hours", "type", "blockers"]

[[board.views]]
name = "assignee"
group_by = "assignee"
shown = ["repo", "importance", "hours", "type", "blockers"]

[[board.views]]
name = "type"
group_by = "type"
shown = ["repo", "assignees", "importance", "hours", "blockers"]

[[board.views]]
name = "importance"
group_by = "importance"
shown = ["repo", "assignees", "hours", "type", "blockers"]

[[board.views]]
name = "nothing"
group_by = "nothing"
shown = ["repo", "assignees", "importance", "hours", "type", "blockers"]

[[board.views]]
name = "chain"
group_by = "chain"
shown = ["repo", "number", "assignees", "importance", "hours", "type", "blockers"]
