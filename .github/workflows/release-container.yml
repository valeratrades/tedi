jobs:
  release:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: github.ref_type == 'tag'
        name: Validate tag (strict semver)
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a strict semver vX.Y.Z[-prerelease] — refusing to release" >&2
            exit 1
          fi
        shell: bash
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Build + push containers
        run: |
          set -euo pipefail
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          # Extract to a var first: `for x in $(cmd)` swallows cmd's exit code, so a
          # failed eval (e.g. a flake error) would leave the loop empty and the job GREEN.
          names="$(nix eval --json ".#containers.$sys" --apply builtins.attrNames | jq -r '.[]')"
          [ -n "$names" ] || { echo "::error::no containers found under .#containers.$sys" >&2; exit 1; }
          # nixpkgs skopeo rejects the GH runner's v1-format /etc/containers/registries.conf
          # ("must be in v2 format"); point it at our own minimal v2 file so it never reads the host's.
          CONTAINERS_REGISTRIES_CONF="$(mktemp)"; export CONTAINERS_REGISTRIES_CONF
          printf 'unqualified-search-registries = []\n' > "$CONTAINERS_REGISTRIES_CONF"
          for name in $names; do
            echo "::group::$name"
            RESULT="$(nix build ".#$name-container" --no-link --print-out-paths --quiet)"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              nix run nixpkgs#skopeo -- copy \
                "docker-archive:$RESULT" \
                "docker://ghcr.io/valeratrades/${name,,}:${{ github.ref_name }}"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "::error::dispatch publishes main's head only, not ${{ github.ref }}" >&2; exit 1; }
              nix run nixpkgs#skopeo -- copy \
                "docker-archive:$RESULT" \
                "docker://ghcr.io/valeratrades/${name,,}:main-${GITHUB_SHA::8}"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              head="${{ github.event.pull_request.head.sha }}"
              nix run nixpkgs#skopeo -- copy \
                "docker-archive:$RESULT" \
                "docker://ghcr.io/valeratrades/${name,,}:pr-${{ github.event.pull_request.number }}-${head::8}"
            else
              echo "cache-seed build ($name) on ${{ github.ref_name }} — skipping GHCR push"
            fi
            echo "::endgroup::"
          done
        shell: bash
    timeout-minutes: 40
name: Release containers
on:
  pull_request:
    types:
      - labeled
      - synchronize
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
