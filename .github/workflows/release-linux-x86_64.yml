env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch tags
        run: git fetch --tags --force --no-recurse-submodules
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Remove .cargo/config.toml
        run: rm -f "$GITHUB_WORKSPACE/.cargo/config.toml" "$GITHUB_WORKSPACE/.cargo/config"
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          PNAME="${GITHUB_REPOSITORY##*/}"
          tar -czvf "$GITHUB_WORKSPACE/${PNAME}-x86_64-unknown-linux-gnu.tar.gz" $PNAME
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-size.json][content]={\"schemaVersion\": 1, \"label\": \"size\", \"message\": \"$(LC_ALL=C numfmt --to=iec-i --suffix=B --format=%.1f $(stat -c %s target/x86_64-unknown-linux-gnu/release/$PNAME))\", \"color\": \"lightblue\"}"
      - id: version
        name: Resolve version tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ -n "$LATEST" ]]; then
              echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::No existing v* tags found, skipping versioned release"
              echo "tag=" >> "$GITHUB_OUTPUT"
            fi
          fi
        shell: bash
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Release (latest)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}-x86_64-unknown-linux-gnu.tar.gz
          make_latest: false
          name: Latest linux-x86_64
          prerelease: true
          tag_name: latest-linux-x86_64
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.version.outputs.tag != ''
        name: Release (versioned)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}-x86_64-unknown-linux-gnu.tar.gz
          tag_name: ${{ steps.version.outputs.tag }}
name: Release linux-x86_64
on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch: {}
permissions:
  contents: write
