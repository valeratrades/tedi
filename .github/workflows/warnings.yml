env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  code-duplication:
    name: Code Duplication
    needs:
      - load_nix
      - pre_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-
      - name: Debug nix environment
        run: |
          echo "=== NIX ENVIRONMENT DEBUG ==="
          echo ""
          echo "1. Which nix:"
          which nix || echo "nix not found in PATH"
          echo ""
          echo "2. Nix version:"
          nix --version || echo "failed"
          echo ""
          echo "3. Current PATH:"
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "4. LD_LIBRARY_PATH (before nix-shell):"
          echo "$LD_LIBRARY_PATH"
          echo ""
          echo "5. NIX_PROFILES:"
          echo "$NIX_PROFILES"
          echo ""
          echo "6. Package store paths:"
          echo "  mold: $(nix-build '<nixpkgs>' -A mold --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  egl-wayland: $(nix-build '<nixpkgs>' -A egl-wayland --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  wayland: $(nix-build '<nixpkgs>' -A wayland --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  libGL: $(nix-build '<nixpkgs>' -A libGL --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  libgbm: $(nix-build '<nixpkgs>' -A libgbm --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  fd: $(nix-build '<nixpkgs>' -A fd --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  pkg-config: $(nix-build '<nixpkgs>' -A pkg-config --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  pkg-config: $(nix-build '<nixpkgs>' -A pkg-config --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  openssl.out: $(nix-build '<nixpkgs>' -A openssl.out --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  openssl.dev: $(nix-build '<nixpkgs>' -A openssl.dev --no-out-link 2>/dev/null || echo 'FAILED')"

          echo ""
          echo "7. libssl.so locations in nix store:"
          find /nix/store -name 'libssl.so*' 2>/dev/null | head -20 || echo "none found"
          echo ""
          echo "8. libgbm.so locations in nix store:"
          find /nix/store -name 'libgbm.so*' 2>/dev/null | head -20 || echo "none found"
          echo ""
          echo "9. Contents of openssl lib dir:"
          ls -la "$(nix-build '<nixpkgs>' -A openssl --no-out-link)/lib/" 2>/dev/null || echo "failed"
          echo ""
          echo "10. Contents of openssl.dev lib dir:"
          ls -la "$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib/" 2>/dev/null || echo "failed"
          echo ""
          echo "11. ldd on a test binary (if exists):"
          if [ -f target/debug/todo ]; then
            ldd target/debug/todo 2>&1 || echo "ldd failed"
          else
            echo "binary not built yet"
          fi
          echo ""
          echo "12. System LD_LIBRARY_PATH search dirs:"
          cat /etc/ld.so.conf 2>/dev/null || echo "no ld.so.conf"
          ldconfig -p 2>/dev/null | grep -E "libssl|libgbm" | head -10 || echo "ldconfig failed or no matches"
          echo ""
          echo "13. Test nix-shell environment:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --run 'echo "Inside nix-shell LD_LIBRARY_PATH: $LD_LIBRARY_PATH"'
          echo ""
          echo "14. Test nix-shell with manual LD_LIBRARY_PATH:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --command 'export LD_LIBRARY_PATH="$(nix-build "<nixpkgs>" -A openssl --no-out-link)/lib${LD_LIBRARY_PATH:+:}$LD_LIBRARY_PATH" && echo "Manual LD_LIBRARY_PATH: $LD_LIBRARY_PATH"'
          echo ""
          echo "15. Check if openssl lib has libssl.so.3:"
          OPENSSL_PATH=$(nix-build '<nixpkgs>' -A openssl --no-out-link 2>/dev/null)
          if [ -n "$OPENSSL_PATH" ]; then
            ls -la "$OPENSSL_PATH/lib/" | grep ssl || echo "no ssl libs in openssl"
          fi
          echo ""
          echo "16. Check openssl.out (runtime output):"
          nix-build '<nixpkgs>' -A openssl.out --no-out-link 2>/dev/null && ls -la "$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib/" | grep ssl || echo "openssl.out failed"
          echo ""
          echo "17. Env vars in nix-shell:"
          nix-shell -p openssl --run 'env | grep -E "^(LD_|NIX_|PATH=)" | sort'
          echo ""
          echo "18. Test subprocess inheritance:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --command 'export LD_LIBRARY_PATH="$(nix-build "<nixpkgs>" -A openssl --no-out-link)/lib:$LD_LIBRARY_PATH" && bash -c "echo subprocess sees: \$LD_LIBRARY_PATH"'
          echo ""
          echo "19. All openssl-related packages:"
          nix-env -qaP 'openssl.*' 2>/dev/null | head -20 || echo "query failed"
          echo ""
          echo "20. System libssl:"
          ldconfig -p 2>/dev/null | grep libssl || echo "no system libssl"
          echo ""
          echo "=== END DEBUG ==="
      - uses: actions/checkout@v5
        with:
          path: my_gh_stuff
          repository: valeratrades/v_flakes
          sparse-checkout: github/workflows
          sparse-checkout-cone-mode: false
      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install mold linker
        run: nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A egl-wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libGL --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libgbm --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A fd --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && sudo apt-get install -y mold"
      - name: Install qlty
        uses: qltysh/qlty-action/install@main
      - name: Initialize qlty
        run: nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A egl-wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libGL --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libgbm --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A fd --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && qlty init --no --no-upgrade-check"
      - name: Check for code duplication
        run: nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A egl-wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libGL --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libgbm --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A fd --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && cargo +nightly -Zscript -q my_gh_stuff/github/workflows/code-duplication.rs"
    timeout-minutes: 15
  load_nix:
    runs-on: ubuntu-latest
    steps:
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-
      - name: Cache packages
        run: |
          # Pre-fetch packages into nix store so they're cached for dependent jobs
          # Use nix-shell which properly sets up env vars like PKG_CONFIG_PATH
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --run "echo packages cached"
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  rust-clippy:
    name: Clippy
    needs:
      - load_nix
      - pre_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-
      - name: Debug nix environment
        run: |
          echo "=== NIX ENVIRONMENT DEBUG ==="
          echo ""
          echo "1. Which nix:"
          which nix || echo "nix not found in PATH"
          echo ""
          echo "2. Nix version:"
          nix --version || echo "failed"
          echo ""
          echo "3. Current PATH:"
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "4. LD_LIBRARY_PATH (before nix-shell):"
          echo "$LD_LIBRARY_PATH"
          echo ""
          echo "5. NIX_PROFILES:"
          echo "$NIX_PROFILES"
          echo ""
          echo "6. Package store paths:"
          echo "  mold: $(nix-build '<nixpkgs>' -A mold --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  egl-wayland: $(nix-build '<nixpkgs>' -A egl-wayland --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  wayland: $(nix-build '<nixpkgs>' -A wayland --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  libGL: $(nix-build '<nixpkgs>' -A libGL --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  libgbm: $(nix-build '<nixpkgs>' -A libgbm --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  fd: $(nix-build '<nixpkgs>' -A fd --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  pkg-config: $(nix-build '<nixpkgs>' -A pkg-config --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  pkg-config: $(nix-build '<nixpkgs>' -A pkg-config --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  openssl.out: $(nix-build '<nixpkgs>' -A openssl.out --no-out-link 2>/dev/null || echo 'FAILED')"

          echo "  openssl.dev: $(nix-build '<nixpkgs>' -A openssl.dev --no-out-link 2>/dev/null || echo 'FAILED')"

          echo ""
          echo "7. libssl.so locations in nix store:"
          find /nix/store -name 'libssl.so*' 2>/dev/null | head -20 || echo "none found"
          echo ""
          echo "8. libgbm.so locations in nix store:"
          find /nix/store -name 'libgbm.so*' 2>/dev/null | head -20 || echo "none found"
          echo ""
          echo "9. Contents of openssl lib dir:"
          ls -la "$(nix-build '<nixpkgs>' -A openssl --no-out-link)/lib/" 2>/dev/null || echo "failed"
          echo ""
          echo "10. Contents of openssl.dev lib dir:"
          ls -la "$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib/" 2>/dev/null || echo "failed"
          echo ""
          echo "11. ldd on a test binary (if exists):"
          if [ -f target/debug/todo ]; then
            ldd target/debug/todo 2>&1 || echo "ldd failed"
          else
            echo "binary not built yet"
          fi
          echo ""
          echo "12. System LD_LIBRARY_PATH search dirs:"
          cat /etc/ld.so.conf 2>/dev/null || echo "no ld.so.conf"
          ldconfig -p 2>/dev/null | grep -E "libssl|libgbm" | head -10 || echo "ldconfig failed or no matches"
          echo ""
          echo "13. Test nix-shell environment:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --run 'echo "Inside nix-shell LD_LIBRARY_PATH: $LD_LIBRARY_PATH"'
          echo ""
          echo "14. Test nix-shell with manual LD_LIBRARY_PATH:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --command 'export LD_LIBRARY_PATH="$(nix-build "<nixpkgs>" -A openssl --no-out-link)/lib${LD_LIBRARY_PATH:+:}$LD_LIBRARY_PATH" && echo "Manual LD_LIBRARY_PATH: $LD_LIBRARY_PATH"'
          echo ""
          echo "15. Check if openssl lib has libssl.so.3:"
          OPENSSL_PATH=$(nix-build '<nixpkgs>' -A openssl --no-out-link 2>/dev/null)
          if [ -n "$OPENSSL_PATH" ]; then
            ls -la "$OPENSSL_PATH/lib/" | grep ssl || echo "no ssl libs in openssl"
          fi
          echo ""
          echo "16. Check openssl.out (runtime output):"
          nix-build '<nixpkgs>' -A openssl.out --no-out-link 2>/dev/null && ls -la "$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib/" | grep ssl || echo "openssl.out failed"
          echo ""
          echo "17. Env vars in nix-shell:"
          nix-shell -p openssl --run 'env | grep -E "^(LD_|NIX_|PATH=)" | sort'
          echo ""
          echo "18. Test subprocess inheritance:"
          nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev --command 'export LD_LIBRARY_PATH="$(nix-build "<nixpkgs>" -A openssl --no-out-link)/lib:$LD_LIBRARY_PATH" && bash -c "echo subprocess sees: \$LD_LIBRARY_PATH"'
          echo ""
          echo "19. All openssl-related packages:"
          nix-env -qaP 'openssl.*' 2>/dev/null | head -20 || echo "query failed"
          echo ""
          echo "20. System libssl:"
          ldconfig -p 2>/dev/null | grep libssl || echo "no system libssl"
          echo ""
          echo "=== END DEBUG ==="
      - uses: dtolnay/rust-toolchain@clippy
      - name: Download modified by pre-ci Cargo.toml files
        uses: actions/download-artifact@v7
        with:
          name: modified-cargo-files
      - run: nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A egl-wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libGL --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libgbm --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A fd --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && rm -f \"\$GITHUB_WORKSPACE/.cargo/config.toml\" \"\$GITHUB_WORKSPACE/.cargo/config\""
      - run: nix-shell -p mold egl-wayland wayland libGL libgbm fd pkg-config pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A egl-wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A wayland --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libGL --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A libgbm --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A fd --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && cargo clippy --workspace --all-targets -- -Dwarnings"
    timeout-minutes: 45
  rust-doc:
    env:
      RUSTDOCFLAGS: -Dwarnings
    if: needs.pre_ci.outputs.continue
    name: Documentation
    needs:
      - load_nix
      - pre_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
