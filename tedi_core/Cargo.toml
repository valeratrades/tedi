[package]
name = "tedi_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Pure todo primitives (issues, blockers) and their parse/serialize for tedi"
license.workspace = true
repository.workspace = true
include = ["src/**/*"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] } # v_utils hashes with ahash

[dependencies]
arrayvec.workspace = true
copy_arrayvec.workspace = true
derive-new.workspace = true
derive_more.workspace = true
jiff.workspace = true
miette.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
strum.workspace = true
tedi_md.workspace = true
tedi_utils.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-error.workspace = true
url.workspace = true
v_utils = { workspace = true, features = ["macros"] }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
