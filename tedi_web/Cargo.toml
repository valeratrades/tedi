[package]
name = "tedi_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The board in a browser: tedi's own store and sync, served"
license.workspace = true
repository.workspace = true
include = ["src/**/*", "README.md", "build.rs"]

[package.metadata.cargo-machete]
ignored = [
    "dioxus-server",
    "getrandom",
    "wasm-bindgen",
] # `#[server]` expands to `dioxus_server` paths; the other two are a feature switch and a version pin

[[bin]]
name = "tedi_web"
path = "src/main.rs"
required-features = ["web"] # the client; the server is `tedi web`

[features]
# The client bundle (wasm), built by `dx`. No `dioxus/fullstack` here: it forces hydration, and nothing is server-rendered.
web = [
    "dioxus/web",
    "dioxus-fullstack/web",
    "dep:ev_lib",
    "dep:tilers_dioxus",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:getrandom",
    "dep:futures",
    "dep:gloo-timers",
    "dep:pulldown-cmark",
    "dep:serde_json",
    "jiff/js",
]
# `#[server]` emits its handler half under this crate's own `server` feature.
server = [
    "dioxus/server",
    "dioxus/fullstack",
    "dep:dioxus-server",
    "dep:futures",
    "dep:tedi_task_operations",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:color-eyre",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:serde_json",
    "dep:tower-http",
    "dep:tracing",
    "dep:toml",
    "dep:toml_edit",
]

[dependencies]
# server
color-eyre = { workspace = true, optional = true }
dioxus.workspace = true
dioxus-fullstack.workspace = true
dioxus-server = { workspace = true, optional = true }
# web
ev_lib = { workspace = true, features = ["uikit_dioxus", "wasm"], optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, features = ["wasm_js"], optional = true } # v_utils (via tedi_core) hashes with ahash
gloo-timers = { workspace = true, features = ["futures"], optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
jiff.workspace = true
pulldown-cmark = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
strum.workspace = true
tedi_core.workspace = true
tedi_task_operations = { workspace = true, optional = true }
tilers_core.workspace = true
tilers_dioxus = { workspace = true, features = ["web"], optional = true }
tokio = { workspace = true, features = ["sync", "net", "time", "macros"], optional = true }
tokio-stream = { workspace = true, features = ["sync"], optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs"], optional = true }
tracing = { workspace = true, optional = true }
urlencoding.workspace = true
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "Document", "Element", "EventTarget", "History", "KeyboardEvent", "Location", "Navigator", "Performance", "Storage", "Window"], optional = true }

[build-dependencies]
ev_lib_classes.workspace = true

[lints]
workspace = true
