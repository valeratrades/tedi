[package]
name = "tedi_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The board in a browser: tedi's own store and sync, served"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tedi_web"
path = "src/main.rs"
required-features = ["web"] # the client; the server is `tedi web`

[features]
# The client bundle (wasm), built by `dx`. No `dioxus/fullstack` here: it forces hydration, and nothing is server-rendered.
web = [
    "dioxus/web",
    "dioxus-fullstack/web",
    "dep:ev_lib",
    "dep:tilers_dioxus",
    "dep:web-sys",
    "dep:getrandom",
    "dep:futures",
    "dep:gloo-timers",
]
# `#[server]` emits its handler half under this crate's own `server` feature.
server = [
    "dioxus/server",
    "dioxus/fullstack",
	"dep:dioxus-server",
    "dep:tedi_task_operations",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:color-eyre",
    "dep:jiff",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:serde_json",
    "dep:tower-http",
    "dep:tracing",
]

[dependencies]
dioxus = { workspace = true }
dioxus-fullstack = { workspace = true }
serde.workspace = true
strum.workspace = true
tedi_core.workspace = true

# web
ev_lib = { workspace = true, features = ["uikit_dioxus", "wasm"], optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, features = ["wasm_js"], optional = true } # v_utils (via tedi_core) hashes with ahash
gloo-timers = { workspace = true, features = ["futures"], optional = true }
tilers_dioxus = { workspace = true, features = ["web"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Storage", "Window"], optional = true }

# server
dioxus-server = { workspace = true, optional = true }
color-eyre = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tedi_task_operations = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "net", "time", "macros"], optional = true }
tokio-stream = { workspace = true, features = ["sync"], optional = true }
tower-http = { workspace = true, features = ["fs"], optional = true }
tracing = { workspace = true, optional = true }

[build-dependencies]
ev_lib_classes = { workspace = true }

[lints]
workspace = true
