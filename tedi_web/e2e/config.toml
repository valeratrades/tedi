# What Figma shows: team board, scopes by owner, two views.
github_token = "mock"
watch = ["service-arb", "ev-main", "ev-estate"]

[board.workflows]
kanban = "preset:kanban"
pull_requests = "preset:pull_requests"

[[board.views]]
name = "Triage"
group_by = "state:kanban"
shown = ["repo", "number", "assignees", "importance", "hours", "type", "blockers", "prs"]
hidden = ["done", "wont_do", "backlog"]
tints = { triage = "orange", selected = "blue", in_progress = "blue", in_review = "purple", done = "green" }

[[board.views]]
name = "Triage (mine)"
group_by = "state:kanban"
shown = ["repo", "number", "assignees", "importance", "hours", "type", "blockers", "prs"]
hidden = ["done", "wont_do", "backlog"]

[board.columns."kanban · notion tints"]
by = "state:kanban"
tints = { triage = "orange", selected = "blue", in_progress = "blue", in_review = "purple", done = "green" }

[board.columns."triage focus"]
by = "state:kanban"
tints = { triage = "orange", selected = "blue" }

[board.scopes.EV.EV-Estate]
repos = ["ev-estate/*"]

[board.scopes.EV.EV-Main]
repos = ["ev-main/*"]

[board.scopes.EV.EV-Service-Arb]
repos = ["service-arb/*"]