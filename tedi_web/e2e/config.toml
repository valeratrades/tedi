# What Figma shows: team board.
github_token = "mock"
watch = ["service-arb", "ev-main", "ev-estate"]
orgs.ev-main = ["service-arb", "ev-estate"]

[board.workflows]
kanban = "preset:kanban"
pull_requests = "preset:pull_requests"

[[board.views]]
name = "kanban"
group_by = "state:kanban"
shown = ["repo", "number", "assignees", "importance", "hours", "type", "blockers", "prs"]
tints = { triage = "orange", selected = "blue", in_progress = "blue", in_review = "purple", done = "green" }
