# The team board. Not applied from here: gitops owns what runs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tedi-board-store }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: tedi-board-config }
data:
  # `github_token` and `github_webhook_secret` come from the Secret's env.
  config.toml: |
    github_token = { env = "GITHUB_TOKEN" }
    github_webhook_secret = { env = "GITHUB_WEBHOOK_SECRET" }
    watch = ["EV-Main", "EV-Estate", "EV-Service-Arb"]

    [milestones]
    url = "https://github.com/EV-Main/sprints"

    [board]
    archive_after = "1w"

    [[board.views]]
    name = "Triage"
    query = "is:open stage:icebox,triage,selected,in_progress,in_review"
    layout = "board"
    group_by = "stage"
    sort = "rank"
    shown = ["repo", "assignees", "importance", "hours", "type", "blockers"]

    [[board.views]]
    name = "My issues"
    query = "assignee:@me is:open"
    layout = "list"
    group_by = "stage"
    sort = "rank"
    shown = ["repo", "stage", "importance", "hours"]

    [board.scopes.EV-Main]
    repos = ["EV-Main/*"]
    [board.scopes.EV-Estate]
    repos = ["EV-Estate/*"]
    [board.scopes.EV-Service-Arb]
    repos = ["EV-Service-Arb/*"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tedi-board }
spec:
  replicas: 1 # one writer per store: the flock is per pod
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tedi-board } }
  template:
    metadata: { labels: { app: tedi-board } }
    spec:
      containers:
        - name: tedi
          image: ghcr.io/valeratrades/tedi-board:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: tedi-board } }] # GITHUB_TOKEN, GITHUB_WEBHOOK_SECRET
          volumeMounts:
            - { name: store, mountPath: /data }
            - { name: config, mountPath: /config/tedi }
      volumes:
        - { name: store, persistentVolumeClaim: { claimName: tedi-board-store } }
        - { name: config, configMap: { name: tedi-board-config } }
---
apiVersion: v1
kind: Service
metadata: { name: tedi-board }
spec:
  selector: { app: tedi-board }
  ports: [{ port: 80, targetPort: 8080 }]
